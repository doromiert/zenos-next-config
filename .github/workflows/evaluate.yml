name: Evaluate ZenOS configuration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Use ZenPkgs locked Nix
        run: |
          NIX_BIN=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          printf '%s/bin\n' "$NIX_BIN" >> "$GITHUB_PATH"
      # The installer supplies disks and the initial password after loading this config.
      - name: Compile doromi-tul-2 online config
        run: nix build --no-link --show-trace .#nixosConfigurations.doromi-tul-2.config.system.build.zenosGeneratedConfig
